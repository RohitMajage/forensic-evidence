{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Verify Face or Voice</h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="uploaded_face" class="form-label">Face Image (optional)</label>
                            {{ form.uploaded_face }}
                        </div>
                        <div class="mb-3">
                            <label for="uploaded_voice" class="form-label">Voice Recording (optional)</label>
                            {{ form.uploaded_voice }}
                        </div>
                        <button type="submit" class="btn btn-success w-100">Verify</button>
                    </form>
                        {% if match_result %}
                            <div class="alert alert-success mt-4">
                                Match found with Case: <strong>{{ match_result }}</strong>
                            </div>
                        {% elif match_result is not none %}
                            <div class="alert alert-danger mt-4">
                                No match found.
                            </div>
                        {% endif %}


                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
