{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Upload New Evidence</h2>
    <form method="post" enctype="multipart/form-data" class="p-3 border rounded bg-light">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Upload</button>
    </form>
</div>
{% endblock %}
