{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<style>
    .form-container {
        background-color: #f8f9fa;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        max-width: 600px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        color: #007bff;
        text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
    }

    .btn-success {
        background-color: #28a745;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        padding: 10px 20px;
        transition: all 0.3s ease;
    }

    .btn-success:hover {
        background-color: #218838;
    }

    .btn-secondary {
        border-radius: 8px;
        font-size: 16px;
        padding: 10px 20px;
    }
</style>

<div class="container mt-5">
     <!-- Breadcrumb Navigation -->
     <nav>
        <ol class="breadcrumb p-3 shadow-sm">
            <li class="breadcrumb-item">
                <a href="{% url 'base' %}">
                    <i class="bi bi-house-door"></i> Home
                </a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">
                <i class="bi bi-person-circle"></i> Edit Profile
            </li>
        </ol>
    </nav>
    <h1><i class="bi bi-person-circle"></i> Edit Profile</h1>
    <div class="form-container mt-4">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="text-center">
                <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Save Changes</button>
                <a href="{% url 'view_profile' %}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
